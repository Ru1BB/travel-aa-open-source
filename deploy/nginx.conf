limit_req_zone $binary_remote_addr zone=travel_aa_rate:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=travel_aa_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/travel-aa-acme;
        try_files $uri =404;
    }
    location / { return 308 https://__PUBLIC_HOST__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    ssl_certificate /etc/travel-aa-letsencrypt/live/__TLS_CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/travel-aa-letsencrypt/live/__TLS_CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:travel_aa_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    if ($host != __PUBLIC_HOST__) { return 444; }
    client_max_body_size 7m;
    client_body_timeout 20s;
    limit_req zone=travel_aa_rate burst=30 nodelay;
    limit_req_status 429;
    limit_conn travel_aa_connections 20;
    add_header Strict-Transport-Security "max-age=86400" always;
    location = /api/setup { return 403; }
    location = /legacy { return 404; }
    location ^~ /legacy/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host __PUBLIC_HOST__;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
